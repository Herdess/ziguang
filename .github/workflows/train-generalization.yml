name: Train generalization model

on:
  workflow_dispatch:
    inputs:
      base:
        description: Residual baseline
        type: choice
        options:
          - calibrated
          - raw
        default: calibrated
      target_encoding:
        description: Add leakage-safe categorical residual statistics
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        seed: [20260929, 20260930, 20260931]
    steps:
      - uses: actions/checkout@v4

      - name: Install training dependency
        run: python3 -m pip install --disable-pip-version-check lightgbm

      - name: Build no-cache baseline
        working-directory: fpga-exact-astar
        run: |
          make clean
          make -j2 CXXFLAGS="-O3 -DNDEBUG -std=c++17 -Wall -Wextra"
          mkdir -p build/model/${{ matrix.seed }}
          ./estimate --no-public-cache --no-repeat-accel \
            --feature-output build/model/${{ matrix.seed }}/search_features.csv \
            -in data/delay_estimate_ans.csv \
            -out build/model/${{ matrix.seed }}/baseline_no_cache_1m.csv

      - name: Train architecture-aware residual model
        working-directory: fpga-exact-astar
        run: |
          set -o pipefail
          TARGET_ENCODING_ARG=""
          if [ "${{ inputs.target_encoding }}" = "true" ]; then
            TARGET_ENCODING_ARG="--target-encoding"
          fi
          python3 tools/train_lightgbm_residual.py \
            --golden data/delay_estimate_ans.csv \
            --estimate build/model/${{ matrix.seed }}/baseline_no_cache_1m.csv \
            --features build/model/${{ matrix.seed }}/search_features.csv \
            --base "${{ inputs.base }}" \
            --seed ${{ matrix.seed }} \
            --output-model build/model/${{ matrix.seed }}/generalization_model.txt \
            --output-validation build/model/${{ matrix.seed }}/validation_predictions.npz \
            --rounds 3000 \
            --leaves 48 \
            --depth 8 \
            --min-data 250 \
            $TARGET_ENCODING_ARG \
            | tee build/model/${{ matrix.seed }}/training_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: generalization-model-${{ inputs.base }}-${{ matrix.seed }}
          path: |
            fpga-exact-astar/build/model/${{ matrix.seed }}/generalization_model.txt
            fpga-exact-astar/build/model/${{ matrix.seed }}/training_report.txt
            fpga-exact-astar/build/model/${{ matrix.seed }}/validation_predictions.npz
          if-no-files-found: error
          retention-days: 30

  ensemble:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: generalization-model-${{ inputs.base }}-*
          path: downloaded-models

      - name: Install evaluation dependency
        run: python3 -m pip install --disable-pip-version-check numpy

      - name: Score strict-holdout ensemble
        working-directory: fpga-exact-astar
        run: |
          set -o pipefail
          python3 tools/evaluate_prediction_ensemble.py \
            ../downloaded-models/*/validation_predictions.npz \
            | tee ensemble_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: generalization-ensemble-report-${{ inputs.base }}
          path: fpga-exact-astar/ensemble_report.txt
          if-no-files-found: error
